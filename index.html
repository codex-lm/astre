<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Astre</title>
  <meta name="description" content="Astre — Asteroids back from 1979: inertial rocket, splitting rocks, wrap-around sky, dash, combos, drones and mega-rocks.">
  <style>
/* Astre — feuille de style « rétro 50s / atomic age » : crème, tomate, menthe. */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

:root {
  --cream: #f3e9d2;
  --cream-deep: #e7d9b8;
  --tomato: #d94f2b;
  --tomato-deep: #b03a1e;
  --mint: #7fc8a9;
  --ink: #2d2a26;
}

body {
  font-family: Georgia, "Times New Roman", serif;
  background: linear-gradient(165deg, #f7efdd, var(--cream-deep)) fixed;
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

#app {
  max-width: 860px;
  margin: 0 auto;
  padding: 12px 12px 6px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ---------------------------------------------------------------- en-tête */
#top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.brand h1 {
  font-size: clamp(40px, 8vw, 64px);
  letter-spacing: 0.18em;
  font-weight: 900;
  color: var(--ink);
  text-shadow: 3px 3px 0 var(--tomato), 6px 6px 0 rgba(45, 42, 38, 0.15);
  animation: floatTitle 3.2s ease-in-out infinite;
}
@keyframes floatTitle {
  0%, 100% { transform: translateY(0) rotate(-0.4deg); }
  50% { transform: translateY(-6px) rotate(0.4deg); }
}
/* rochers décoratifs de l'accueil */
#home { position: relative; overflow: hidden; }
.deco-rock {
  position: absolute;
  border: 3px solid var(--ink);
  border-radius: 46%;
  opacity: 0.5;
  pointer-events: none;
  animation: driftRock linear infinite;
}
.deco-rock.r1 { width: 90px; height: 76px; background: var(--tomato); right: 4%; top: 8%; animation-duration: 26s; }
.deco-rock.r2 { width: 56px; height: 48px; background: var(--mint); right: 20%; bottom: 12%; animation-duration: 34s; }
.deco-rock.r3 { width: 34px; height: 30px; background: #d9c9a8; right: 8%; bottom: 30%; animation-duration: 21s; }
@keyframes driftRock {
  from { transform: translateY(20px) rotate(0deg); }
  to { transform: translateY(-30px) rotate(360deg); }
}
#tagline { font-size: 13.5px; font-style: italic; margin-top: 2px; }
.topctl { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.langs { display: flex; gap: 4px; }

/* ---------------------------------------------------------------- boutons */
button {
  font: inherit;
  font-weight: 700;
  color: var(--ink);
  background: var(--cream);
  border: 3px solid var(--ink);
  border-radius: 999px;
  padding: 9px 18px;
  cursor: pointer;
  box-shadow: 3px 3px 0 var(--ink);
  transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
}
button:hover { background: #fbf5e4; }
button:active { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
button:focus-visible { outline: 3px solid var(--tomato); outline-offset: 2px; }
button.primary {
  background: var(--tomato);
  color: var(--cream);
}
button.big { font-size: 18px; padding: 13px 30px; }
.pill { padding: 4px 11px; font-size: 12px; box-shadow: 2px 2px 0 var(--ink); border-width: 2px; }
.pill.active { background: var(--ink); color: var(--cream); }

/* ---------------------------------------------------------------- écrans */
main { flex: 1; display: flex; flex-direction: column; }
.screen { animation: fadein 0.25s ease; }
.hidden { display: none !important; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

.subtitle { margin: 18px 4px; max-width: 56ch; line-height: 1.6; font-size: 15px; }
.homebtns { display: flex; gap: 12px; flex-wrap: wrap; margin: 0 4px 8px; }
.keys { opacity: 0.75; font-size: 12.5px; margin: 10px 4px; text-align: center; }
#hud-best { font-weight: 700; margin: 0 6px; }

/* ---------------------------------------------------------------- jeu */
#game { display: flex; flex-direction: column; }
#canvas-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  background: var(--cream);
  border: 3px solid var(--ink);
  border-radius: 12px;
  box-shadow: 6px 6px 0 rgba(45, 42, 38, 0.2);
  overflow: hidden;
}
#game-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

/* contrôles tactiles */
#touch-ui { display: none; }
body.touch #touch-ui { display: block; }
#stick {
  position: absolute;
  left: 14px; bottom: 14px;
  width: 110px; height: 110px;
  border: 3px solid var(--ink);
  border-radius: 50%;
  background: rgba(243, 233, 210, 0.55);
  touch-action: none;
}
#stick-knob {
  position: absolute;
  left: 50%; top: 50%;
  width: 46px; height: 46px;
  margin: -23px 0 0 -23px;
  border-radius: 50%;
  background: var(--tomato);
  border: 3px solid var(--ink);
}
.touchbtn {
  position: absolute;
  width: 74px; height: 74px;
  border-radius: 50%;
  font-size: 14px;
  letter-spacing: 0.06em;
  touch-action: none;
  user-select: none;
}
#btn-fire { right: 16px; bottom: 44px; background: var(--tomato); color: var(--cream); }
#btn-dash { right: 104px; bottom: 14px; background: var(--mint); }
body.touch .keys.desktop-only { display: none; }

/* ---------------------------------------------------------------- overlays */
#overlay {
  position: fixed; inset: 0;
  background: rgba(45, 42, 38, 0.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 10;
  padding: 20px;
  animation: fadein 0.2s ease;
}
#overlay-card {
  background: var(--cream);
  border: 3px solid var(--ink);
  border-radius: 14px;
  box-shadow: 6px 6px 0 var(--ink);
  padding: 26px 24px;
  max-width: 460px;
  width: 100%;
  text-align: center;
}
#overlay-card h2 { font-size: 26px; letter-spacing: 0.08em; margin-bottom: 12px; }
#overlay-card button { margin-top: 14px; }
.rules { text-align: left; }
.rules p { margin: 10px 0; line-height: 1.6; font-size: 14px; }
.go-title { color: var(--tomato); text-shadow: 2px 2px 0 var(--ink); }
.newbest {
  display: inline-block;
  background: var(--mint);
  border: 2px solid var(--ink);
  border-radius: 8px;
  padding: 4px 12px;
  font-weight: 700;
  transform: rotate(-2deg);
  margin-bottom: 8px;
}
.big { font-size: 20px; font-weight: 900; }

/* ---------------------------------------------------------------- pied */
footer {
  margin-top: 14px;
  padding: 8px 4px 6px;
  opacity: 0.72;
  font-size: 11.5px;
  text-align: center;
  font-style: italic;
}
@supports (padding: env(safe-area-inset-bottom)) {
  footer { padding-bottom: calc(6px + env(safe-area-inset-bottom)); }
}

</style>
</head>
<body>
  <div id="app">
    <header id="top">
      <div class="brand">
        <h1>ASTRE</h1>
        <p id="tagline"></p>
      </div>
      <div class="topctl">
        <div id="langs" class="langs" role="group" aria-label="Language"></div>
        <button id="btn-sound" class="ghost"></button>
      </div>
    </header>

    <main>
      <section id="home" class="screen">
        <div class="deco-rock r1"></div>
        <div class="deco-rock r2"></div>
        <div class="deco-rock r3"></div>
        <p class="subtitle" data-i18n="subtitle"></p>
        <div class="homebtns">
          <button id="btn-play" class="primary big"></button>
          <button id="btn-howto" class="big"></button>
        </div>
        <p id="hud-best"></p>
        <p class="keys desktop-only" data-i18n="keysHint"></p>
        <p class="keys touch-only" data-i18n="touchHint" style="display:none"></p>
      </section>

      <section id="game" class="screen hidden">
        <div id="canvas-wrap">
          <canvas id="game-canvas"></canvas>
          <div id="touch-ui">
            <div id="stick"><div id="stick-knob"></div></div>
            <button id="btn-fire" class="touchbtn">FIRE</button>
            <button id="btn-dash" class="touchbtn">DASH</button>
          </div>
        </div>
        <p class="keys desktop-only" data-i18n="keysHint"></p>
      </section>
    </main>

    <footer>
      <span data-i18n="credit"></span>
    </footer>
  </div>

  <div id="overlay" class="hidden" role="dialog" aria-modal="true">
    <div id="overlay-card"></div>
  </div>

  <script>
/*
 * Astre — moteur de jeu pur (sans DOM), déterministe : pas fixe + RNG seedé.
 * Asteroids remis au goût du jour : champ unique toroïdal, vaisseau à inertie,
 * astéroïdes qui se fragmentent, dash contrôlé, combo multiplicateur,
 * drones à patterns, méga-astéroïde boss. Testable sous Node.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.AstreEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var W = 800, H = 600;
  var DT = 1 / 60;
  var ROT = 3.8;            // rad/s
  var THRUST = 300;         // u/s²
  var DAMP = 0.995;         // amortissement par pas (léger, goût du jour)
  var BULLET_SPEED = 520, BULLET_LIFE = 1.1, FIRE_CD = 0.22;
  var DASH_SPEED = 380, DASH_CD = 2.5, DASH_INV = 0.3;
  var RESPAWN_INV = 2.5;
  var ROCK_R = { 1: 16, 2: 30, 3: 52, 4: 92 };
  var ROCK_SCORE = { 1: 100, 2: 50, 3: 20, 4: 500 };
  var DRONE_SCORE = { big: 200, small: 350 };
  var COMBO_MAX = 8, COMBO_WINDOW = 2.0, SLOWMO_T = 0.45, SLOWMO_SCALE = 0.35;
  var SAFE_SPAWN = 220, SAFE_RESPAWN = 140;
  var PU_LIFE = 10.0, PU_R = 20;
  var TRIPLE_T = 8.0, SLOWFX_T = 4.0, SLOWFX_SCALE = 0.45;

  var PU_DROPRATE = { rock: { 3: 0.16, 2: 0.13, 1: 0.10 }, drone: { big: 0.25, small: 0.30 } };

  function makePowerUp(g, x, y) {
    var r = rng(g);
    var type = r < 0.34 ? 'triple' : r < 0.61 ? 'shield' : r < 0.90 ? 'slow' : 'life';
    var a = rng(g) * Math.PI * 2;
    return { type: type, x: x, y: y,
             vx: Math.cos(a) * 22, vy: Math.sin(a) * 22, life: PU_LIFE, age: 0 };
  }

  // RNG mulberry32 à état sérialisable
  function rndNext(s) {
    s = (s + 0x6d2b79f5) | 0;
    var t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return { s: s, v: ((t ^ (t >>> 14)) >>> 0) / 4294967296 };
  }

  function wrap(v, max) { v = v % max; if (v < 0) v += max; return v; }

  function createGame(opts) {
    opts = opts || {};
    var g = {
      W: W, H: H, t: 0,
      rngS: (opts.seed >>> 0) || 20261103,
      ship: { x: W / 2, y: H / 2, vx: 0, vy: 0, angle: -Math.PI / 2, invuln: 2.0, lives: 3, fireCd: 0, dashCd: 0, gone: false },
      bullets: [], ebullets: [], rocks: [], drones: [], powerUps: [],
      fx: { triple: 0, slow: 0 }, shield: false, hitStop: 0, deathSlow: 0,
      score: 0, wave: 0, waveBreak: 1.2, combo: 0, comboT: 0,
      nextLifeAt: 10000, over: false, slowmo: 0, droneT: 8, kills: 0,
      events: []
    };
    spawnWave(g, 1);
    return g;
  }

  function rng(g) {
    var r = rndNext(g.rngS);
    g.rngS = r.s;
    return r.v;
  }

  function makeRock(g, size, x, y, vx, vy) {
    var n = 9 + Math.floor(rng(g) * 5);
    var shape = [];
    for (var i = 0; i < n; i++) shape.push(0.72 + rng(g) * 0.38);
    var speed = size === 4 ? 26 : (size === 3 ? 46 : size === 2 ? 78 : 118);
    if (vx === undefined) {
      var a = rng(g) * Math.PI * 2;
      var m = speed * (0.6 + rng(g) * 0.7);
      vx = Math.cos(a) * m; vy = Math.sin(a) * m;
    }
    return { x: x, y: y, vx: vx, vy: vy, r: ROCK_R[size], size: size,
             ang: rng(g) * Math.PI * 2, angV: (rng(g) - 0.5) * 1.6,
             shape: shape, hp: size === 4 ? 12 : 1, age: 0 };
  }

  function spawnWave(g, wave) {
    g.wave = wave;
    var n = Math.min(3 + wave, 8);
    for (var i = 0; i < n; i++) {
      var x, y, tries = 0;
      do {
        x = rng(g) * W; y = rng(g) * H; tries++;
      } while (tries < 60 && dist2(x, y, g.ship.x, g.ship.y) < SAFE_SPAWN * SAFE_SPAWN);
      g.rocks.push(makeRock(g, 3, x, y));
    }
    if (wave % 4 === 0) g.rocks.push(makeRock(g, 4, rng(g) * W, rng(g) < 0.5 ? 40 : H - 40));
    g.events.push({ type: 'wave', wave: wave });
  }

  function dist2(ax, ay, bx, by) {
    var dx = ax - bx, dy = ay - by;
    return dx * dx + dy * dy;
  }

  function fragment(g, rock) {
    if (rock.size <= 1) return;
    for (var k = 0; k < 2; k++) {
      var a = rng(g) * Math.PI * 2;
      var m = 60 + rng(g) * 70;
      g.rocks.push(makeRock(g, rock.size - 1,
        rock.x + Math.cos(a) * rock.r * 0.4, rock.y + Math.sin(a) * rock.r * 0.4,
        rock.vx + Math.cos(a) * m, rock.vy + Math.sin(a) * m));
    }
  }

  function addScore(g, base) {
    var mult = Math.max(1, g.combo);
    g.score += base * mult;
    if (g.score >= g.nextLifeAt) {
      g.ship.lives++;
      // première vie à 10 000, puis une tous les 15 000 : la tension tient
      g.nextLifeAt += 15000;
      g.events.push({ type: 'extraLife', lives: g.ship.lives });
    }
  }

  function killCombo(g) {
    g.kills++;
    if (g.comboT > 0) g.combo = Math.min(COMBO_MAX, g.combo + 1);
    else g.combo = 1;
    g.comboT = COMBO_WINDOW;
    if (g.combo === COMBO_MAX && g.slowmo <= 0) { g.slowmo = SLOWMO_T; g.events.push({ type: 'comboMax' }); }
    else g.events.push({ type: 'comboUp', combo: g.combo });
  }

  // un power-up tombe-t-il de cette destruction ?
  function maybeDrop(g, kind, size, x, y) {
    var rate = PU_DROPRATE[kind][size];
    if (rate === undefined || rng(g) >= rate) return;
    g.powerUps.push(makePowerUp(g, x, y));
  }

  // un coup reçu : le bouclier l'absorbe, sinon une vie part
  function applyHit(g, x, y) {
    var sh = g.ship;
    if (g.shield) {
      g.shield = false;
      sh.invuln = 1.2;
      g.hitStop = 3;
      g.events.push({ type: 'shieldHit', x: x, y: y });
      return;
    }
    sh.lives--;
    g.combo = 0; g.comboT = 0;
    g.hitStop = 4;
    g.deathSlow = 0.45;
    g.events.push({ type: 'shipHit', x: sh.x, y: sh.y, lives: sh.lives });
    if (sh.lives < 0) {
      g.over = true;
      g.events.push({ type: 'gameOver', score: g.score });
    } else {
      sh.gone = true;
      g.respawnT = 0.9;
    }
  }

  function respawnShip(g) {
    var spots = [[W / 2, H / 2]];
    for (var i = 0; i < 8; i++) {
      var a = i * Math.PI / 4;
      spots.push([W / 2 + Math.cos(a) * 180, H / 2 + Math.sin(a) * 180]);
    }
    for (var s = 0; s < spots.length; s++) {
      var ok = true;
      for (var r = 0; r < g.rocks.length && ok; r++)
        if (dist2(spots[s][0], spots[s][1], g.rocks[r].x, g.rocks[r].y) < SAFE_RESPAWN * SAFE_RESPAWN) ok = false;
      if (ok) { g.ship.x = wrap(spots[s][0], W); g.ship.y = wrap(spots[s][1], H); break; }
    }
    g.ship.vx = 0; g.ship.vy = 0;
    g.ship.invuln = RESPAWN_INV;
    g.ship.gone = false;
  }

  function spawnDrone(g) {
    var big = rng(g) < 0.55;
    var fromLeft = rng(g) < 0.5;
    g.drones.push({
      x: fromLeft ? -30 : W + 30, y: 60 + rng(g) * (H - 120),
      vx: (fromLeft ? 1 : -1) * (big ? 70 : 110), vy: 0,
      big: big, hp: big ? 2 : 1, phase: rng(g) * Math.PI * 2, fireT: 1.2
    });
  }

  /*
   * Un pas de simulation. input = { left, right, thrust, fire, dash }.
   * Renvoie les événements du pas (sons/particules côté rendu).
   */
  function step(g, input) {
    g.events = [];
    if (g.over) return g.events;
    // hit-stop : gel bref (steps entiers) sur les gros impacts
    if (g.hitStop > 0) { g.hitStop--; return g.events; }
    var scale = g.slowmo > 0 ? SLOWMO_SCALE : (g.deathSlow > 0 ? 0.3 : 1);
    var dt = DT * scale;
    g.t += dt;
    if (g.slowmo > 0) g.slowmo -= DT;
    if (g.deathSlow > 0) g.deathSlow -= DT;
    var sh = g.ship;
    var rockDt = dt * (g.fx.slow > 0 ? SLOWFX_SCALE : 1);

    // ---- vaisseau
    if (!sh.gone) {
      if (input.left) sh.angle -= ROT * dt;
      if (input.right) sh.angle += ROT * dt;
      if (input.thrust) {
        sh.vx += Math.cos(sh.angle) * THRUST * dt;
        sh.vy += Math.sin(sh.angle) * THRUST * dt;
      }
      if (input.dash && sh.dashCd <= 0) {
        sh.vx += Math.cos(sh.angle) * DASH_SPEED;
        sh.vy += Math.sin(sh.angle) * DASH_SPEED;
        sh.dashCd = DASH_CD;
        sh.invuln = Math.max(sh.invuln, DASH_INV);
        g.events.push({ type: 'dash' });
      }
      sh.dashCd = Math.max(0, sh.dashCd - DT);
      sh.invuln = Math.max(0, sh.invuln - DT);
      sh.fireCd = Math.max(0, sh.fireCd - DT);
      if (input.fire && sh.fireCd <= 0) {
        sh.fireCd = FIRE_CD;
        var spread = g.fx.triple > 0 ? [-0.16, 0, 0.16] : [0];
        spread.forEach(function (off) {
          g.bullets.push({
            x: sh.x + Math.cos(sh.angle) * 18, y: sh.y + Math.sin(sh.angle) * 18,
            vx: sh.vx + Math.cos(sh.angle + off) * BULLET_SPEED,
            vy: sh.vy + Math.sin(sh.angle + off) * BULLET_SPEED,
            life: BULLET_LIFE
          });
        });
        g.events.push({ type: 'shoot', triple: spread.length === 3 });
      }
      sh.vx *= DAMP; sh.vy *= DAMP;
      sh.x = wrap(sh.x + sh.vx * dt, W);
      sh.y = wrap(sh.y + sh.vy * dt, H);
    }

    // ---- projectiles
    for (var b = g.bullets.length - 1; b >= 0; b--) {
      var bu = g.bullets[b];
      bu.life -= dt;
      bu.x = wrap(bu.x + bu.vx * dt, W);
      bu.y = wrap(bu.y + bu.vy * dt, H);
      if (bu.life <= 0) g.bullets.splice(b, 1);
    }
    for (var e = g.ebullets.length - 1; e >= 0; e--) {
      var eb = g.ebullets[e];
      eb.life -= dt;
      eb.x = wrap(eb.x + eb.vx * rockDt, W);
      eb.y = wrap(eb.y + eb.vy * rockDt, H);
      if (eb.life <= 0) g.ebullets.splice(e, 1);
    }

    // ---- astéroïdes (ralentis par le power-up slow)
    for (var r = 0; r < g.rocks.length; r++) {
      var rk = g.rocks[r];
      rk.x = wrap(rk.x + rk.vx * rockDt, W);
      rk.y = wrap(rk.y + rk.vy * rockDt, H);
      rk.ang += rk.angV * rockDt;
      rk.age += dt;
    }

    // ---- drones (ralentis par slow)
    for (var d = 0; d < g.drones.length; d++) {
      var dr = g.drones[d];
      dr.phase += dt * 2.2;
      dr.x += dr.vx * rockDt;
      dr.y = wrap(dr.y + Math.sin(dr.phase) * 60 * rockDt, H);
      dr.fireT -= dt;
      if (dr.fireT <= 0 && !sh.gone) {
        dr.fireT = dr.big ? 1.7 : 1.1;
        var aim = Math.atan2(sh.y - dr.y, sh.x - dr.x);
        aim += (rng(g) - 0.5) * (dr.big ? 0.7 : 0.24);
        g.ebullets.push({ x: dr.x, y: dr.y, vx: Math.cos(aim) * 300, vy: Math.sin(aim) * 300, life: 3.0 });
        g.events.push({ type: 'droneShoot' });
      }
    }
    // drones sortis de l'écran (marge large)
    for (var d2 = g.drones.length - 1; d2 >= 0; d2--)
      if (g.drones[d2].x < -80 || g.drones[d2].x > W + 80) g.drones.splice(d2, 1);

    // ---- drones : apparition
    g.droneT -= dt;
    if (g.droneT <= 0 && g.wave >= 2 && g.drones.length < 2 && g.waveBreak <= 0) {
      spawnDrone(g);
      g.droneT = 11 + rng(g) * 5;
      g.events.push({ type: 'droneIn' });
    }

    // ---- collisions projectiles joueur → astéroïdes
    for (var b2 = g.bullets.length - 1; b2 >= 0; b2--) {
      var bu2 = g.bullets[b2];
      for (var r2 = g.rocks.length - 1; r2 >= 0; r2--) {
        var rk2 = g.rocks[r2];
        if (dist2(bu2.x, bu2.y, rk2.x, rk2.y) < rk2.r * rk2.r) {
          g.bullets.splice(b2, 1);
          rk2.hp--;
          if (rk2.hp <= 0) {
            g.rocks.splice(r2, 1);
            fragment(g, rk2);
            killCombo(g);

      if (prev === null || prev === undefined || !alpha) return cur;
      return prev + (cur - prev) * alpha;
    }

    function drawShip(g, prev, alpha) {
      var sh = g.ship;
      if (sh.gone) return;
      if (sh.invuln > 0 && sh.invuln > 0.35 && Math.floor(sh.invuln * 12) % 2 === 0) return;
      var x = lerpPos(sh.x, prev && prev.ship ? prev.ship.x : null, alpha);
      var y = lerpPos(sh.y, prev && prev.ship ? prev.ship.y : null, alpha);
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(sh.angle + Math.PI / 2);
      if (g.__thrusting) {
        ctx.fillStyle = COL.tomato;
        ctx.beginPath();
        ctx.moveTo(-5, 12); ctx.lineTo(5, 12);
        ctx.lineTo(0, 22 + Math.random() * 7);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = COL.mustard;
        ctx.beginPath();
        ctx.moveTo(-3, 12); ctx.lineTo(3, 12);
        ctx.lineTo(0, 17 + Math.random() * 4);
        ctx.closePath(); ctx.fill();
      }
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = COL.ink;
      ctx.fillStyle = COL.chrome;
      ctx.beginPath();
      ctx.moveTo(0, -16); ctx.lineTo(11, 10); ctx.lineTo(5, 7);
      ctx.lineTo(0, 12); ctx.lineTo(-5, 7); ctx.lineTo(-11, 10);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = COL.tomato;
      ctx.beginPath(); ctx.arc(0, -4, 3.2, 0, Math.PI * 2); ctx.fill();
      if (g.shield) {
        ctx.strokeStyle = COL.mint;
        ctx.lineWidth = 3.5;
        ctx.globalAlpha = 0.65 + 0.3 * Math.sin(clock * 6);
        ctx.beginPath();
        ctx.arc(0, 0, 27 + Math.sin(clock * 6) * 2, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      if (sh.dashCd > 0) {
        ctx.strokeStyle = 'rgba(127,200,169,0.9)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, 22, -Math.PI / 2, -Math.PI / 2 + (1 - sh.dashCd / 2.5) * Math.PI * 2);
        ctx.stroke();
      } else {
        ctx.strokeStyle = COL.mint; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.restore();
    }

    function drawRock(rk) {
      ctx.save();
      ctx.translate(rk.x, rk.y);
      ctx.rotate(rk.ang);
      var pop = rk.age < 0.15 ? backOut(Math.max(0, rk.age) / 0.15) : 1;
      var pp = Math.max(0.05, pop);
      ctx.scale(pp, pp);
      var fill = rk.size === 4 ? COL.tomatoDeep : rk.size === 3 ? COL.beige : rk.size === 2 ? COL.tomato : COL.mint;
      ctx.fillStyle = fill;
      ctx.strokeStyle = COL.ink;
      ctx.lineWidth = rk.size >= 3 ? 3 : 2.6;
      ctx.beginPath();
      var n = rk.shape.length;
      for (var i = 0; i < n; i++) {
        var a = (i / n) * Math.PI * 2;
        var rr = rk.r * rk.shape[i];
        var x = Math.cos(a) * rr, y = Math.sin(a) * rr;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(45,42,38,0.18)';
      for (var c = 0; c < Math.min(3, rk.size); c++) {
        var ca = (c * 2.4 + rk.r) % (Math.PI * 2);
        var cd = rk.r * 0.36;
        ctx.beginPath();
        ctx.arc(Math.cos(ca) * cd, Math.sin(ca) * cd, rk.r * 0.16 + 1, 0, Math.PI * 2);
        ctx.fill();
      }
      if (rk.size === 4) {
        ctx.fillStyle = COL.cream;
        ctx.beginPath(); ctx.arc(0, 0, rk.r * 0.42, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = COL.ink; ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = COL.ink;
        ctx.font = 'bold ' + Math.round(rk.r * 0.4) + 'px Georgia';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(String(rk.hp), 0, 1);
      }
      ctx.restore();
    }

    function drawDrone(dr, px, py, alpha) {
      var x = lerpPos(dr.x, px, alpha), y = lerpPos(dr.y, py, alpha);
      ctx.save();
      ctx.translate(x, y);
      var w = dr.big ? 26 : 18;
      ctx.fillStyle = COL.mint;
      ctx.strokeStyle = COL.ink;
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.ellipse(0, 0, w, w * 0.42, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(0, -w * 0.25, w * 0.5, w * 0.32, 0, Math.PI, Math.PI * 2);
      ctx.fillStyle = COL.chrome; ctx.fill(); ctx.stroke();
      ctx.fillStyle = COL.tomato;
      ctx.beginPath(); ctx.arc(0, 0, w * 0.16, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // badge power-up « Googie » : silhouette d'abord, couleur ensuite
    function drawPowerUp(pu, px, py, alpha) {
      var x = lerpPos(pu.x, px, alpha);
      var y = lerpPos(pu.y, py, alpha) + Math.sin(clock * 3 + pu.x) * 3;
      var blink = pu.life < 2.5 && Math.floor(pu.life * 8) % 2 === 0;
      if (blink) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.strokeStyle = COL.ink;
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 5]);
      ctx.lineDashOffset = -clock * 22;
      ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = COL.cream;
      ctx.strokeStyle = COL.ink;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, 13, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      var col = pu.type === 'triple' ? COL.tomato : pu.type === 'shield' ? COL.mint :
                pu.type === 'slow' ? COL.mustard : COL.gold;
      ctx.strokeStyle = col;
      ctx.fillStyle = col;
      ctx.lineWidth = 3.2;
      if (pu.type === 'triple') {
        for (var k = -1; k <= 1; k++) {
          ctx.save(); ctx.rotate(k * 0.5);
          ctx.beginPath();
          ctx.moveTo(-2, -6); ctx.lineTo(4, 0); ctx.lineTo(-2, 6);
          ctx.closePath(); ctx.fill();
          ctx.restore();
        }
      } else if (pu.type === 'shield') {
        ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, 2.4, 0, Math.PI * 2); ctx.fill();
      } else if (pu.type === 'slow') {
        ctx.beginPath();
        ctx.moveTo(-5, -7); ctx.lineTo(5, -7); ctx.lineTo(-5, 7); ctx.lineTo(5, 7);
        ctx.closePath(); ctx.stroke();
      } else { // life : étoile 4 branches or
        ctx.beginPath();
        for (var s = 0; s < 4; s++) {
          var a = s * Math.PI / 2 - Math.PI / 2;
          var a2 = a + Math.PI / 4;
          ctx.lineTo(Math.cos(a) * 8, Math.sin(a) * 8);
          ctx.lineTo(Math.cos(a2) * 2.6, Math.sin(a2) * 2.6);
        }
        ctx.closePath(); ctx.fill();
      }
      if (pu.age < 0.25) {
        ctx.globalAlpha = 1 - pu.age / 0.25;
        ctx.strokeStyle = col;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, 20 + pu.age * 90, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      ctx.restore();
    }

    function draw(g, dtReal, labels, alpha, prev) {
      clock += dtReal;
      alpha = Math.min(1, Math.max(0, alpha || 0));
      var cssW = canvas.width / (Math.min(root.devicePixelRatio || 1, 2));
      var cssH = canvas.height / (Math.min(root.devicePixelRatio || 1, 2));
      ctx.save();
      ctx.fillStyle = COL.cream;
      ctx.fillRect(0, 0, cssW, cssH);
      if (grain) {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(grain, 0, 0, cssW, cssH);
        ctx.imageSmoothingEnabled = true;
      }
      // soleil rétro (coin haut droit)
      var sunX = cssW - 90, sunY = 84;
      ctx.strokeStyle = 'rgba(217,79,43,0.35)';
      ctx.lineWidth = 3;
      for (var ray = 0; ray < 12; ray++) {
        var ra = ray * Math.PI / 6 + clock * 0.08;
        ctx.beginPath();
        ctx.moveTo(sunX + Math.cos(ra) * 56, sunY + Math.sin(ra) * 56);
        ctx.lineTo(sunX + Math.cos(ra) * 72, sunY + Math.sin(ra) * 72);
        ctx.stroke();
      }
      ctx.fillStyle = '#eebf8f';
      ctx.beginPath(); ctx.arc(sunX, sunY, 44, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(176,58,30,0.5)'; ctx.lineWidth = 2.5;
      ctx.stroke();
      // étoiles (certaines colorées, scintillantes)
      for (var s = 0; s < stars.length; s++) {
        var st = stars[s];
        var tw = 0.75 + 0.25 * Math.sin(clock * 2.2 + st.phase);
        ctx.globalAlpha = tw;
        ctx.fillStyle = st.colored ? st.col : COL.creamDeep;
        var sx = st.x * cssW, sy = st.y * cssH;
        ctx.fillRect(sx, sy, st.s, st.s);
        if (st.s > 2) {
          ctx.fillRect(sx - 2.4, sy + 0.5, 2.4, 1);
          ctx.fillRect(sx + st.s + 0.2, sy + 0.5, 2.4, 1);
        }
        ctx.globalAlpha = 1;
      }
      if (g.slowmo > 0 || g.deathSlow > 0) {
        ctx.fillStyle = 'rgba(217,79,43,' + (0.10 * Math.min(1, (g.slowmo + g.deathSlow) / 0.45)) + ')';
        ctx.fillRect(0, 0, cssW, cssH);
      }

      // monde (letterbox + secousse + micro-rotation)
      var shx = shake > 0 ? (Math.random() - 0.5) * shake : 0;
      var shy = shake > 0 ? (Math.random() - 0.5) * shake : 0;
      var rot = shake > 0 ? (Math.random() - 0.5) * shake * 0.004 : 0;
      if (shake > 0) shake = Math.max(0, shake - dtReal * 34);
      ctx.translate(offX + shx, offY + shy);
      ctx.rotate(rot);
      ctx.scale(scaleX, scaleY);
      ctx.strokeStyle = COL.ink;
      ctx.lineWidth = 3;
      ctx.strokeRect(0, 0, 800, 600);
      // anneaux planétaires décoratifs
      ctx.strokeStyle = 'rgba(107,152,177,0.16)';
      ctx.lineWidth = 10;
      ctx.beginPath(); ctx.ellipse(150, 470, 180, 34, -0.3, 0, Math.PI * 2); ctx.stroke();
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.ellipse(660, 130, 130, 22, 0.25, 0, Math.PI * 2); ctx.stroke();

      // trail du réacteur
      if (!g.ship.gone) {
        trail.push({ x: g.ship.x, y: g.ship.y });
        if (trail.length > 14) trail.shift();
      }
      for (var tr = 0; tr < trail.length; tr++) {
        var tp = trail[tr];
        var k = tr / trail.length;
        ctx.globalAlpha = 0.28 * k * (g.__thrusting ? 1 : 0.4);
        ctx.fillStyle = COL.tomato;
        ctx.beginPath();
        ctx.arc(tp.x, tp.y, 2 + k * 5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      g.rocks.forEach(drawRock);
      for (var d = 0; d < g.drones.length; d++)
        drawDrone(g.drones[d], prev && prev.drones && prev.drones[d] ? prev.drones[d][0] : null,
                                    prev && prev.drones && prev.drones[d] ? prev.drones[d][1] : null, alpha);
      for (var p = 0; p < g.powerUps.length; p++)
        drawPowerUp(g.powerUps[p], prev && prev.powerUps && prev.powerUps[p] ? prev.powerUps[p][0] : null,
                                             prev && prev.powerUps && prev.powerUps[p] ? prev.powerUps[p][1] : null, alpha);
      // projectiles
      ctx.strokeStyle = COL.ink;
      ctx.lineWidth = 2.6;
      for (var b = 0; b < g.bullets.length; b++) {
        var bu = g.bullets[b];
        var bx = lerpPos(bu.x, prev && prev.bullets && prev.bullets[b] ? prev.bullets[b][0] : null, alpha);
        var by = lerpPos(bu.y, prev && prev.bullets && prev.bullets[b] ? prev.bullets[b][1] : null, alpha);
        ctx.beginPath();
        ctx.moveTo(bx, by);
        ctx.lineTo(bx - bu.vx * 0.016, by - bu.vy * 0.016);
        ctx.stroke();
      }
      // tirs ennemis : losanges encre à cœur tomate — jamais confondus avec les rochers
      for (var e = 0; e < g.ebullets.length; e++) {
        var eb = g.ebullets[e];
        var ex = lerpPos(eb.x, prev && prev.ebullets && prev.ebullets[e] ? prev.ebullets[e][0] : null, alpha);
        var ey = lerpPos(eb.y, prev && prev.ebullets && prev.ebullets[e] ? prev.ebullets[e][1] : null, alpha);
        ctx.beginPath();
        ctx.moveTo(ex, ey - 6); ctx.lineTo(ex + 4.4, ey);
        ctx.lineTo(ex, ey + 6); ctx.lineTo(ex - 4.4, ey);
        ctx.closePath();
        ctx.fillStyle = COL.tomato; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = COL.ink; ctx.stroke();
      }
      drawShip(g, prev, alpha);

      // particules
      for (var pa = particles.length - 1; pa >= 0; pa--) {
        var pc = particles[pa];
        pc.t += dtReal;
        if (pc.t >= pc.life) { particles.splice(pa, 1); continue; }
        pc.x += pc.vx * dtReal; pc.y += pc.vy * dtReal;
        pc.vx *= 0.96; pc.vy *= 0.96;
        var pal = 1 - pc.t / pc.life;
        ctx.globalAlpha = pal;
        ctx.fillStyle = pc.color;
        ctx.beginPath(); ctx.arc(pc.x, pc.y, pc.r * pal + 0.6, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }

      // points flottants
      ctx.font = 'bold 17px Georgia';
      for (var fl = floats.length - 1; fl >= 0; fl--) {
        var fo = floats[fl];
        fo.t += dtReal;
        if (fo.t > 0.8) { floats.splice(fl, 1); continue; }
        ctx.globalAlpha = 1 - fo.t / 0.8;
        ctx.fillStyle = fo.color;
        ctx.textAlign = 'center';
        ctx.fillText(fo.txt, fo.x, fo.y - fo.t * 34);
        ctx.globalAlpha = 1;
      }

      // HUD : score animé + pop
      if (g.score !== scoreShown) {
        if (g.score > scoreShown) scorePop = 0.18;
        scoreShown += (g.score - scoreShown) * Math.min(1, dtReal * 9);
        if (Math.abs(g.score - scoreShown) < 1) scoreShown = g.score;
      }
      scorePop = Math.max(0, scorePop - dtReal);
      var scoreScale = 1 + scorePop * 1.4;
      ctx.save();
      ctx.translate(14, 12);
      ctx.scale(scoreScale, scoreScale);
      ctx.fillStyle = COL.ink;
      ctx.font = 'bold 26px Georgia';
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText(String(Math.round(scoreShown)).padStart(6, '0'), 0, 0);
      ctx.restore();
      ctx.fillStyle = COL.ink;
      ctx.font = '13px Georgia';
      ctx.fillText(labels.wave + ' ' + g.wave, 14, 44);
      for (var l = 0; l < Math.max(0, g.ship.lives); l++) {
        ctx.save();
        ctx.translate(760 - l * 24, 26);
        ctx.fillStyle = COL.tomato;
        ctx.beginPath();
        ctx.moveTo(0, -8); ctx.lineTo(6, 7); ctx.lineTo(0, 4); ctx.lineTo(-6, 7);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      // badges power-ups actifs (icône + jauge)
      var badges = [];
      if (g.fx.triple > 0) badges.push(['triple', g.fx.triple / 8, COL.tomato]);
      if (g.shield) badges.push(['shield', 1, COL.mint]);
      if (g.fx.slow > 0) badges.push(['slow', g.fx.slow / 4, COL.mustard]);
      for (var bi = 0; bi < badges.length; bi++) {
        ctx.save();
        ctx.translate(706, 64 + bi * 38);
        ctx.strokeStyle = COL.ink; ctx.lineWidth = 2.6;
        ctx.fillStyle = COL.cream;
        ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = badges[bi][2];
        ctx.fillStyle = badges[bi][2];
        if (badges[bi][0] === 'triple') {
          ctx.beginPath(); ctx.moveTo(-4, -5); ctx.lineTo(3, 0); ctx.lineTo(-4, 5); ctx.closePath(); ctx.fill();
        } else if (badges[bi][0] === 'shield') {
          ctx.beginPath(); ctx.arc(0, 0, 5.5, 0, Math.PI * 2); ctx.stroke();
          ctx.beginPath(); ctx.arc(0, 0, 1.8, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.beginPath(); ctx.moveTo(-3.5, -5); ctx.lineTo(3.5, -5); ctx.lineTo(-3.5, 5); ctx.lineTo(3.5, 5);
          ctx.closePath(); ctx.stroke();
        }
        ctx.strokeStyle = badges[bi][2];
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 0, 15, -Math.PI / 2, -Math.PI / 2 + badges[bi][1] * Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // combo
      if (g.combo > 1) {
        var pulse = 1 + 0.08 * Math.sin(g.t * 10);
        ctx.save();
        ctx.translate(400, 70);
        ctx.scale(pulse, pulse);
        ctx.rotate(-0.05);
        ctx.fillStyle = COL.tomato;
        ctx.strokeStyle = COL.ink; ctx.lineWidth = 2.5;
        ctx.font = 'bold 30px Georgia';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        var txt = '×' + g.combo;
        var wid = ctx.measureText(txt).width + 22;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(-wid / 2, -22, wid, 44, 10);
        else ctx.rect(-wid / 2, -22, wid, 44);
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = COL.cream;
        ctx.fillText(txt, 0, 1);
        ctx.restore();
      }

      // stickers (CHAUD / EN FEU)
      for (var stI = stickers.length - 1; stI >= 0; stI--) {
        var stk = stickers[stI];
        stk.t += dtReal;
        if (stk.t > 1.1) { stickers.splice(stI, 1); continue; }
        var popS = stk.t < 0.25 ? backOut(stk.t / 0.25) : 1;
        ctx.save();
        ctx.translate(400, 140 - stk.t * 26);
        ctx.rotate(-0.06);
        ctx.scale(popS, popS);
        ctx.globalAlpha = stk.t > 0.8 ? Math.max(0, 1 - (stk.t - 0.8) / 0.3) : 1;
        ctx.font = 'bold 34px Georgia';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = stk.color;
        ctx.strokeStyle = COL.ink; ctx.lineWidth = 2.5;
        ctx.strokeText(stk.txt, 0, 0);
        ctx.fillText(stk.txt, 0, 0);
        ctx.restore();
        ctx.globalAlpha = 1;
      }

      // bannière de vague
      if (waveBanner) {
        waveBanner.t += dtReal;
        var alphaW = waveBanner.t < 0.3 ? waveBanner.t / 0.3 : Math.max(0, 1 - (waveBanner.t - 1.2) / 0.5);
        if (alphaW <= 0) waveBanner = null;
        else {
          ctx.globalAlpha = alphaW;
          ctx.save();
          ctx.translate(400, 260); ctx.rotate(-0.04);
          ctx.font = 'bold 54px Georgia';
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          var w2 = ctx.measureText(waveBanner.text).width + 40;
          ctx.fillStyle = COL.tomato;
          ctx.strokeStyle = COL.ink; ctx.lineWidth = 3;
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(-w2 / 2, -40, w2, 80, 14);
          else ctx.rect(-w2 / 2, -40, w2, 80);
          ctx.fill(); ctx.stroke();
          ctx.fillStyle = COL.cream;
          ctx.fillText(waveBanner.text, 0, 2);
          ctx.restore();
          ctx.globalAlpha = 1;
        }
      }

      // flash bref
      if (flash > 0) {
        ctx.globalAlpha = Math.min(0.5, flash * 5);
        ctx.fillStyle = flashCol;
        ctx.fillRect(-20, -20, 840, 640);
        ctx.globalAlpha = 1;
        flash -= dtReal;
      }
      ctx.restore();
    }

    return { resize: resize, draw: draw, onEvent: onEvent, banner: banner };
  }

  return { create: create, COL: COL };
});

</script>
  <script>
/*
 * Astre — contrôleur : boucle à pas fixe (accumulateur + garde-fou), entrées
 * clavier et tactiles, écrans, pause, hook QA.
 */
(function () {
  'use strict';
  var E = window.AstreEngine, I18N = window.AstreI18n, AU = window.AstreAudio;

  var SAVE_KEY = 'astre.save.v1';
  var save = { lang: 'en', sound: true, best: 0 };
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      var p = JSON.parse(raw);
      save = { lang: p.lang || 'en', sound: p.sound !== false, best: p.best || 0 };
    }
  } catch (e) {}
  function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
  function t(k) { return I18N.get(save.lang, k); }
  window.__astreLang = save.lang;
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function show(node, on) { node.classList.toggle('hidden', !on); }

  var canvas = $('game-canvas');
  var renderer = window.AstreRender.create(canvas);
  var g = null;
  var running = false, paused = false;
  var input = { left: false, right: false, thrust: false, fire: false, dash: false };
  var touchAim = null;        // {angle, force} du stick
  var acc = 0, last = 0;
  var watchdog = null;

  // ---------------------------------------------------------------- écrans
  function renderTexts() {
    window.__astreLang = save.lang;
    document.documentElement.lang = save.lang;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++) nodes[i].textContent = t(nodes[i].getAttribute('data-i18n'));
    $('tagline').textContent = t('tagline');
    $('btn-play').textContent = t('play');
    $('btn-howto').textContent = t('howTo');
    $('btn-sound').textContent = (save.sound ? '♪ ' : '✕ ') + t(save.sound ? 'soundOn' : 'soundOff');
    $('hud-best').textContent = t('best') + ' ' + save.best;
    renderLangPills();
  }

  function renderLangPills() {
    var box = $('langs');
    box.textContent = '';
    I18N.langs.forEach(function (code) {
      var b = el('button', 'pill' + (save.lang === code ? ' active' : ''), code.toUpperCase());
      b.addEventListener('click', function () {
        save.lang = code; persist(); AU.ui(); renderTexts();
      });
      box.appendChild(b);
    });
  }

  function startGame() {
    var seed = (Date.now() & 0xffffffff) >>> 0;
    g = E.createGame({ seed: seed });
    g.__thrusting = false;
    running = true; paused = false;
    show($('home'), false);
    show($('game'), true);
    closeOverlay();
    last = performance.now();
    acc = 0;
    resize();
  }

  function gameOver() {
    running = false;
    AU.thrust(false);
    var isBest = g.score > save.best;
    if (isBest) { save.best = g.score; persist(); }
    var box = el('div', 'modal');
    box.appendChild(el('h2', 'go-title', t('gameOver')));
    if (isBest) box.appendChild(el('p', 'newbest', t('newBest')));
    box.appendChild(el('p', 'big', t('finalScore') + ' : ' + g.score));
    box.appendChild(el('p', null, t('best') + ' : ' + save.best + ' · ' + t('wave') + ' ' + g.wave));
    var again = el('button', 'primary big', t('replay'));
    again.addEventListener('click', function () { AU.ui(); startGame(); });
    box.appendChild(again);
    var menu = el('button', null, t('menu'));
    menu.addEventListener('click', function () { AU.ui(); goMenu(); });
    box.appendChild(menu);
    overlay(box);
  }

  function goMenu() {
    running = false; g = null;
    show($('game'), false);
    show($('home'), true);
    closeOverlay();
    renderTexts();
  }

  // ---------------------------------------------------------------- overlays
  function overlay(content) {
    var card = $('overlay-card');
    card.textContent = '';
    card.appendChild(content);
    show($('overlay'), true);
  }
  function closeOverlay() { show($('overlay'), false); }

  function showRules() {
    var box = el('div', 'rules');
    box.appendChild(el('h2', null, t('rulesTitle')));
    [1, 2, 3, 4, 5].forEach(function (n) { box.appendChild(el('p', null, t('rule' + n))); });
    var btn = el('button', 'primary', t('gotIt'));
    btn.addEventListener('click', function () { AU.ui(); closeOverlay(); if (paused) showPause(); });
    box.appendChild(btn);
    overlay(box);
  }

  function showPause() {
    var box = el('div', 'modal');
    box.appendChild(el('h2', null, t('paused')));
    var r = el('button', 'primary big', t('resume'));
    r.addEventListener('click', function () {
      AU.ui(); closeOverlay(); paused = false; last = performance.now();
    });
    box.appendChild(r);
    var q = el('button', null, t('menu'));
    q.addEventListener('click', function () { AU.ui(); paused = false; goMenu(); });
    box.appendChild(q);
    overlay(box);
  }

  // ---------------------------------------------------------------- boucle
  function applyTouchAim() {
    if (!touchAim || touchAim.force < 0.25) return;
    var want = touchAim.angle;
    var cur = g.ship.angle;
    var d = want - cur;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    input.left = d < -0.12;
    input.right = d > 0.12;
    input.thrust = touchAim.force > 0.55;
  }

  var hbT = 0; // heartbeat : s'accélère quand il reste peu de rochers

  function snap(g) {
    return {
      ship: { x: g.ship.x, y: g.ship.y },
      bullets: g.bullets.map(function (b) { return [b.x, b.y]; }),
      ebullets: g.ebullets.map(function (b) { return [b.x, b.y]; }),
      drones: g.drones.map(function (d) { return [d.x, d.y]; }),
      powerUps: g.powerUps.map(function (p) { return [p.x, p.y]; })
    };
  }

  function frame(now) {
    requestAnimationFrame(frame);
    if (!running || paused || !g) return;
    var dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (touchAim) applyTouchAim();
    g.__thrusting = input.thrust;
    AU.thrust(input.thrust && !g.ship.gone);
    acc += dt;
    var steps = 0;
    var prev = null;
    while (acc >= E.DT && steps < 4) {
      prev = snap(g);
      var events = E.step(g, input);
      input.dash = false; // dash = front unique
      for (var i = 0; i < events.length; i++) {
        var ev = events[i];
        renderer.onEvent(ev, t);
        if (ev.type === 'shoot') AU.shoot(ev.triple);
        else if (ev.type === 'boom') AU.boom(ev.size);
        else if (ev.type === 'clink') AU.clink();
        else if (ev.type === 'dash') AU.dash();
        else if (ev.type === 'shipHit') AU.shipHit();
        else if (ev.type === 'shieldHit') AU.shieldHit();
        else if (ev.type === 'pickup') AU.pickup(ev.kind);
        else if (ev.type === 'droneShoot') AU.droneShoot();
        else if (ev.type === 'droneDown') AU.droneDown();
        else if (ev.type === 'extraLife') AU.extraLife();
        else if (ev.type === 'comboUp') AU.comboUp(ev.combo);
        else if (ev.type === 'comboMax') AU.comboMax();
        else if (ev.type === 'wave') AU.wave();
        else if (ev.type === 'gameOver') setTimeout(gameOver, 900);
      }
      acc -= E.DT;
      steps++;
    }
    // heartbeat discret, plus rapide quand il reste peu de rochers
    hbT -= dt;
    if (hbT <= 0 && !g.over) {
      AU.heartbeat(0.55 + 0.5 * Math.min(g.rocks.length, 6) / 6);
      hbT = 0.55 + 0.5 * Math.min(g.rocks.length, 6) / 6;
    }
    var alpha = Math.min(1, acc / E.DT);
    renderer.draw(g, dt, { wave: t('wave') }, alpha, prev);
  }

  // garde-fou : si le rAF est étranglé (onglet caché), un minuteur avance peu ;
  // on choisit de mettre en pause plutôt que d'accumuler.
  watchdog = setInterval(function () {
    if (running && !paused && document.hidden) {
      paused = true;
      AU.thrust(false);
      showPause();
    }
  }, 800);

  function resize() {
    var wrap = $('canvas-wrap');
    var w = wrap.clientWidth, h = wrap.clientHeight;
    renderer.resize(w, h);
  }
  window.addEventListener('resize', function () { if (g) resize(); });

  // ---------------------------------------------------------------- entrées
  document.addEventListener('keydown', function (ev) {
    // rejeu instantané : Espace/Entrée relance depuis l'écran de fin
    if (!running && g && !document.getElementById('overlay').classList.contains('hidden') &&
        (ev.key === ' ' || ev.key === 'Enter')) {
      ev.preventDefault();
      startGame();
      return;
    }
    if (!running) return;
    var k = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'q') { input.left = true; ev.preventDefault(); }
    if (k === 'ArrowRight' || k === 'd') { input.right = true; ev.preventDefault(); }
    if (k === 'ArrowUp' || k === 'w' || k === 'z') { input.thrust = true; ev.preventDefault(); }
    if (k === ' ') { input.fire = true; ev.preventDefault(); AU.unlock(); }
    if (k === 'Shift') { input.dash = true; ev.preventDefault(); }
    if (k === 'p') {
      paused = !paused;
      if (paused) { AU.thrust(false); showPause(); } else { last = performance.now(); closeOverlay(); }
    }
  });
  document.addEventListener('keyup', function (ev) {
    var k = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'q') input.left = false;
    if (k === 'ArrowRight' || k === 'd') input.right = false;
    if (k === 'ArrowUp' || k === 'w' || k === 'z') input.thrust = false;
    if (k === ' ') input.fire = false;
  });

  // joystick tactile gauche : le stick pilote le cap (asservi) + poussée
  var stick = $('stick'), knob = $('stick-knob');
  var stickId = null, stickCx = 0, stickCy = 0;
  function stickMove(x, y) {
    var dx = x - stickCx, dy = y - stickCy;
    var d = Math.min(1, Math.hypot(dx, dy) / 46);
    var a = Math.atan2(dy, dx);
    touchAim = { angle: a, force: d };
    knob.style.transform = 'translate(' + Math.cos(a) * d * 34 + 'px,' + Math.sin(a) * d * 34 + 'px)';
  }
  function stickEnd() {
    stickId = null; touchAim = null;
    input.left = input.right = input.thrust = false;
    knob.style.transform = 'translate(0,0)';
  }
  stick.addEventListener('touchstart', function (ev) {
    ev.preventDefault();
    AU.unlock();
    var to = ev.changedTouches[0];
    stickId = to.identifier;
    var r = stick.getBoundingClientRect();
    stickCx = r.left + r.width / 2; stickCy = r.top + r.height / 2;
    stickMove(to.clientX, to.clientY);
  }, { passive: false });
  document.addEventListener('touchmove', function (ev) {
    if (stickId === null) return;
    for (var i = 0; i < ev.changedTouches.length; i++)
      if (ev.changedTouches[i].identifier === stickId) {
        ev.preventDefault();
        stickMove(ev.changedTouches[i].clientX, ev.changedTouches[i].clientY);
      }
  }, { passive: false });
  document.addEventListener('touchend', function (ev) {
    for (var i = 0; i < ev.changedTouches.length; i++)
      if (ev.changedTouches[i].identifier === stickId) stickEnd();
  });

  function holdButton(id, on, off) {
    var b = $(id);
    b.addEventListener('touchstart', function (e) { e.preventDefault(); AU.unlock(); on(); }, { passive: false });
    b.addEventListener('touchend', function (e) { e.preventDefault(); off(); }, { passive: false });
    b.addEventListener('mousedown', on);
    b.addEventListener('mouseup', off);
    b.addEventListener('mouseleave', off);
  }
  holdButton('btn-fire', function () { input.fire = true; }, function () { input.fire = false; });
  holdButton('btn-dash', function () { input.dash = true; }, function () { input.dash = false; });

  // afficher les contrôles tactiles sur écran tactile
  if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches)
    document.body.classList.add('touch');
  window.addEventListener('touchstart', function () { document.body.classList.add('touch'); }, { once: true, passive: true });

  // ---------------------------------------------------------------- boutons
  $('btn-play').addEventListener('click', function () { AU.ui(); AU.unlock(); startGame(); });
  $('btn-howto').addEventListener('click', function () { AU.ui(); showRules(); });
  $('btn-sound').addEventListener('click', function () {
    save.sound = !save.sound; persist();
    AU.setEnabled(save.sound);
    renderTexts();
    if (save.sound) AU.ui();
  });
  $('overlay').addEventListener('click', function (ev) {
    if (ev.target === $('overlay') && !paused) closeOverlay();
  });

  // hook QA (?debug=1) : piloter le moteur sans dépendre du rAF
  if (location.search.indexOf('debug=1') !== -1) {
    window.__astre = {
      g: function () { return g; },
      engine: E,
      input: input,
      start: startGame,
      step: function (n, inp) {
        var saved = {};
        for (var k in input) { saved[k] = input[k]; if (inp && k in inp) input[k] = inp[k]; }
        var all = [];
        for (var i = 0; i < (n || 1); i++) all = all.concat(E.step(g, input));
        for (var k2 in saved) input[k2] = saved[k2];
        renderer.draw(g, 1 / 60, { wave: t('wave') }, 1, null);
        return all;
      },
      draw: function () { if (g) renderer.draw(g, 1 / 60, { wave: t('wave') }, 1, null); },
      gameOver: gameOver,
      save: save
    };
  }

  // ---------------------------------------------------------------- départ
  AU.setEnabled(save.sound);
  renderTexts();
  show($('home'), true);
  resize();
  requestAnimationFrame(frame);
})();

</script>
</body>
</html>
