<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Astre</title>
  <meta name="description" content="Astre — Asteroids back from 1979: inertial rocket, splitting rocks, wrap-around sky, dash, combos, drones and mega-rocks.">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div id="app">
    <header id="top">
      <div class="brand">
        <h1>ASTRE</h1>
        <p id="tagline"></p>
      </div>
      <div class="topctl">
        <div id="langs" class="langs" role="group" aria-label="Language"></div>
        <button id="btn-sound" class="ghost"></button>
      </div>
    </header>

    <main>
      <section id="home" class="screen">
        <div class="deco-rock r1"></div>
        <div class="deco-rock r2"></div>
        <div class="deco-rock r3"></div>
        <p class="subtitle" data-i18n="subtitle"></p>
        <div class="homebtns">
          <button id="btn-play" class="primary big"></button>
          <button id="btn-howto" class="big"></button>
        </div>
        <p id="hud-best"></p>
        <p class="keys desktop-only" data-i18n="keysHint"></p>
        <p class="keys touch-only" data-i18n="touchHint" style="display:none"></p>
      </section>

      <section id="game" class="screen hidden">
        <div id="canvas-wrap">
          <canvas id="game-canvas"></canvas>
          <div id="touch-ui">
            <div id="stick"><div id="stick-knob"></div></div>
            <button id="btn-fire" class="touchbtn">FIRE</button>
            <button id="btn-dash" class="touchbtn">DASH</button>
          </div>
        </div>
        <p class="keys desktop-only" data-i18n="keysHint"></p>
      </section>
    </main>

    <footer>
      <span data-i18n="credit"></span>
    </footer>
  </div>

  <div id="overlay" class="hidden" role="dialog" aria-modal="true">
    <div id="overlay-card"></div>
  </div>

  <script src="assets/engine.js"></script>
  <script src="assets/i18n.js"></script>
  <script src="assets/audio.js"></script>
  <script src="assets/render.js"></script>
  <script src="assets/ui.js"></script>
</body>
</html>
